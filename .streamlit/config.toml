[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#0B0E1A"
secondaryBackgroundColor = "#151A2E"
textColor = "#E8ECF4"
borderColor = "#262E4A"
baseRadius = "0.75rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap"

[theme.sidebar]
backgroundColor = "#0F1324"
secondaryBackgroundColor = "#151A2E"

[server]
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[runner]
magicEnabled = false
